[Telegraph]
; 0 = Telegraph changes nothing
Enabled=1
; machine translation of text that is not in your dictionaries
AutoTranslate=1
; target language: auto = the language of the game, or one of
; fr de it es pt-BR pl ru ko zh-TW ja es-MX zh-CN
Language=auto
; services in the order they are tried. A service that needs a key is skipped
; until you enter one, so by default the two free ones at the end do the work
Providers=deepl,googlecloud,microsoft,deepseek,openai,google,mymemory
; translate the text found inside each mod in the background, before it is shown
PreTranslate=1
; requests per day to all services together (0 = no limit)
MaxPerDay=2000
; 1 = list text without any translation in Telegraph\untranslated\<Mod>.txt
Capture=0
; 1 = also read the dictionaries in the RuText folder
UseRuTextDictionaries=1

[Google]
; Google Translate without a key: the unofficial endpoint browser extensions use.
; Google blocks it now and then ("too many requests"), for hours, in some regions
; for everyone. Telegraph then pauses it and the next service takes over.
MaxPerMinute=3
; characters per request
MaxChars=2000
; characters per hour for background pre-translation (0 = only text on screen)
PreTranslateCharsPerHour=30000

[MyMemory]
; free, no key, only for text on screen: 5000 characters a day, 50000 with an
; e-mail address here (MyMemory uses it to contact you about your usage)
Email=
MaxPerMinute=10

[DeepL]
; DeepL API key (Developer, Pro or an old Free key ending in :fx)
Key=
MaxPerMinute=30

[GoogleCloud]
; Google Cloud Translation API key (500,000 characters a month free, billing
; account needed): console.cloud.google.com, enable "Cloud Translation API"
Key=
MaxPerMinute=30

[Microsoft]
; Azure AI Translator key (free tier F0: 2 million characters a month) and the
; region of the resource, e.g. westeurope (empty for a global resource)
Key=
Region=
MaxPerMinute=30

[DeepSeek]
; API key from https://platform.deepseek.com/api_keys
Key=
Model=deepseek-chat
Endpoint=https://api.deepseek.com/chat/completions
MaxPerMinute=30

[OpenAI]
; any OpenAI-compatible chat completions service: OpenAI, OpenRouter, a local
; LM Studio or Ollama (http://localhost:11434/v1/chat/completions, no key)
Key=
Model=
Endpoint=https://api.openai.com/v1/chat/completions
MaxPerMinute=30
